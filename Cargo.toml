[package]
name = "kcore-console"
version = "0.6.1"
edition = "2021"
description = "kcore appliance console for the hypervisor and for Vault"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
chrono = { version = "0.4" }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ctrlc = "3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
png = "0.17"

[dev-dependencies]
tempfile = "3"
